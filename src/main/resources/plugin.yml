name: DrakesCrates
version: 1.0
main: me.jackstar.drakescrates.DrakesCratesPlugin
api-version: '1.20'
authors: [JackStar]
description: Crates system for DrakesCraft
softdepend: [PlaceholderAPI]
commands:
  oraculo:
    description: Abre El Oraculo y los Relicarios del Olimpo
    usage: /oraculo [givekey|takekey|setpity|reclamar|reload]
    aliases: [relicarios, crates]
  drakescrates:
    description: Admin command for DrakesCrates
    usage: /drakescrates <givekey|editor|reload>
    permission: drakescrates.admin
    aliases: [dcrate, dcrates, drcrate]
permissions:
  drakescrates.admin:
    description: Allows use of DrakesCrates admin command
    default: op
