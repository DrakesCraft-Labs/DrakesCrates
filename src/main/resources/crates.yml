# ==============================================================
#            DRAKESCRATES - CONFIGURACIÓN DE CRATES
# ==============================================================
# Separadas por modalidad:
#   modality: ALL       -> Accesible en todas las modalidades (solo vainilla).
#   modality: CLASICO   -> Exclusiva para la modalidad Clásico (100% Vainilla).
#   modality: SLIMEFUN  -> Contiene ítems de Slimefun. ¡BLOQUEADA EN CLÁSICO!
# ==============================================================

keys:
  comun_key:
    display-name: "<gradient:gold:yellow><b>Llave Común</b></gradient>"
    item:
      material: TRIPWIRE_HOOK
      amount: 1
      name: "<yellow><b>Llave Común</b></yellow>"
      lore:
        - "<gray>Úsala para abrir la Crate Común."
        - "<aqua>Compatible físicamente o virtualmente."
      enchantments:
        unbreaking: 1
      custom-model-data: 1001

  clasico_key:
    display-name: "<gradient:green:dark_green><b>Llave de Clásico</b></gradient>"
    item:
      material: EMERALD
      amount: 1
      name: "<green><b>Llave Vainilla Clásico</b></green>"
      lore:
        - "<gray>Llave exclusiva para el mundo Clásico."
        - "<gray>100% compatible con el modo puro."
      enchantments:
        unbreaking: 3
      custom-model-data: 1002

  sf_tech_key:
    display-name: "<gradient:#9b59b6:#8e44ad><b>Llave Tecnológica Slimefun</b></gradient>"
    item:
      material: AMETHYST_SHARD
      amount: 1
      name: "<light_purple><b>Llave Tecnológica SF</b></light_purple>"
      lore:
        - "<gray>Desbloquea maquinaria y componentes Slimefun."
        - "<red>⚠ Prohibida en la modalidad Clásico."
      enchantments:
        unbreaking: 2
      custom-model-data: 1003

crates:
  # Crate Global (Vainilla para todos los mundos)
  basic:
    display-name: "<gradient:gold:yellow><b>Crate Común</b></gradient>"
    modality: ALL
    type: PHYSICAL_KEY
    key-id: comun_key
    preview-item:
      material: CHEST
      amount: 1
      name: "<gold><b>Crate Común</b></gold>"
      lore:
        - "<gray>Recompensas globales y esenciales."
        - "<green>[100% VAINILLA]</green>"
    locations:
      - "world,0,64,0"
    rewards:
      coins:
        display-name: "<yellow>250 Dragmas / Monedas"
        chance: 50.0
        commands:
          - "eco give %player% 250"
        display-item:
          material: GOLD_NUGGET
          amount: 8
          name: "<yellow>250 Monedas"
          lore:
            - "<gray>Recompensa económica común."
      iron_pack:
        display-name: "<white>Pack de Hierro (16x)"
        chance: 35.0
        vanilla: true
        amount: 16
        display-item:
          material: IRON_INGOT
          amount: 16
          name: "<white>16x Lingotes de Hierro"
      diamond_pack:
        display-name: "<aqua>Diamantes Puros (5x)"
        chance: 15.0
        vanilla: true
        amount: 5
        display-item:
          material: DIAMOND
          amount: 5
          name: "<aqua>5x Diamantes"

  # Crate Exclusiva Clásico (100% Vainilla, minerales y tesoros tradicionales)
  clasico_tesoro:
    display-name: "<gradient:green:dark_green><b>Crate del Explorador Clásico</b></gradient>"
    modality: CLASICO
    type: PHYSICAL_KEY
    key-id: clasico_key
    preview-item:
      material: BARREL
      amount: 1
      name: "<green><b>Crate del Explorador</b></green>"
      lore:
        - "<gray>Diseñada especialmente para Clásico."
        - "<green>[100% VAINILLA]</green>"
    rewards:
      lingote_netherite:
        display-name: "<dark_gray>Lingote de Inframundita"
        chance: 10.0
        vanilla: true
        amount: 1
        display-item:
          material: NETHERITE_INGOT
          amount: 1
          name: "<dark_gray><b>Lingote de Netherite</b></dark_gray>"
      manzana_dorada_notcha:
        display-name: "<gold>Manzana Dorada Encantada"
        chance: 15.0
        vanilla: true
        amount: 2
        display-item:
          material: ENCHANTED_GOLDEN_APPLE
          amount: 2
          name: "<gold><b>Manzana Encantada</b></gold>"
      diamantes_bloques:
        display-name: "<aqua>Bloques de Diamante (4x)"
        chance: 30.0
        vanilla: true
        amount: 4
        display-item:
          material: DIAMOND_BLOCK
          amount: 4
          name: "<aqua>4x Bloques de Diamante"
      totem:
        display-name: "<yellow>Tótem de la Inmortalidad"
        chance: 20.0
        vanilla: true
        amount: 1
        display-item:
          material: TOTEM_OF_UNDYING
          amount: 1
          name: "<yellow>Tótem de la Inmortalidad"
      dragmas_clasico:
        display-name: "<gold>Bolsa de 1,000 Dragmas"
        chance: 25.0
        commands:
          - "eco give %player% 1000"
        display-item:
          material: GOLD_INGOT
          amount: 10
          name: "<gold>1,000 Dragmas"

  # Crate Slimefun Tecnológica (¡BLOQUEADA ESTRICTAMENTE EN CLÁSICO!)
  sf_tecnologia:
    display-name: "<gradient:#9b59b6:#8e44ad><b>Crate Tecnológica Slimefun</b></gradient>"
    modality: SLIMEFUN
    type: PHYSICAL_KEY
    key-id: sf_tech_key
    preview-item:
      material: DAYLIGHT_DETECTOR
      amount: 1
      name: "<light_purple><b>Crate Tecnológica SF</b></light_purple>"
      lore:
        - "<gray>Componentes y paneles de Slimefun."
        - "<light_purple>[SLIMEFUN & TECH]</light_purple>"
        - "<red>Bloqueada en el mundo Clásico.</red>"
    rewards:
      panel_solar:
        display-name: "<gold>Panel Solar Slimefun"
        chance: 15.0
        slimefun-id: "SOLAR_GENERATOR"
        amount: 1
        display-item:
          material: DAYLIGHT_DETECTOR
          amount: 1
          name: "<gold>Panel Solar (Slimefun)"
          lore:
            - "<gray>Generador de energía solar."
      carbon_chunk:
        display-name: "<dark_gray>Trozo de Carbono (Carbon Chunk)"
        chance: 35.0
        slimefun-id: "CARBON_CHUNK"
        amount: 4
        display-item:
          material: COAL
          amount: 4
          name: "<dark_gray>Carbon Chunk (SF)"
      electric_motor:
        display-name: "<blue>Motor Eléctrico Slimefun"
        chance: 25.0
        slimefun-id: "ELECTRIC_MOTOR"
        amount: 2
        display-item:
          material: PISTON
          amount: 2
          name: "<blue>Electric Motor"
      gold_24k:
        display-name: "<yellow>Oro de 24 Quilates (4x)"
        chance: 25.0
        slimefun-id: "GOLD_24K"
        amount: 4
        display-item:
          material: GOLD_INGOT
          amount: 4
          name: "<yellow>Oro 24K (SF)"
